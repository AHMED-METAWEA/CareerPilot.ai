name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector is not optional: the schema uses halfvec and an HNSW index.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
          POSTGRES_DB: careerpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerpilot"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@localhost:5432/careerpilot
      CAREERPILOT_TEST_DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@localhost:5432/careerpilot_test
      ADMIN_TOKEN: local-admin-token

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Type check (mypy strict)
        run: mypy app

      - name: Import discipline (§14.1)
        run: lint-imports

      - name: Migrate
        run: alembic upgrade head

      - name: Schema drift (models vs migrations)
        run: alembic check

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Board registry is well-formed
        # Validates YAML shape and adapter names offline. Live probing is a
        # scheduled job, not a PR gate: a third party being down is not a
        # reason to block a merge.
        run: python -c "from pathlib import Path; from app.services.sources import load_boards; print(len(load_boards(Path('config/boards'))), 'boards')"

