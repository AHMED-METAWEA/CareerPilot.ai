[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot.ai — AI-assisted job discovery and candidate-role matching, built on verifiable data."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "rapidfuzz>=3.10",
  "apscheduler>=3.10",
  "python-dateutil>=2.9",
  "typer>=0.15",
]

[project.optional-dependencies]
# Heavy local-model stack. Not needed for Phase 0 (data spine).
ml = [
  "sentence-transformers>=3.3",
  "torch>=2.5",
  "numpy>=2.1",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-PyYAML",
  "types-python-dateutil",
]

[project.scripts]
careerpilot = "app.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "B008",              # FastAPI Depends() in argument defaults
  "RUF001", "RUF002", "RUF003",  # Arabic text and typographic dashes are deliberate
  "E501",              # long lines are checked by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "apscheduler.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: requires a live PostgreSQL with pgvector (set CAREERPILOT_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]

# ── Import discipline (§14.1) ─────────────────────────────────────────
[tool.importlinter]
root_package = "app"
# Required to forbid third-party imports (httpx, sqlalchemy, …) inside the domain.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: domain <- adapters <- services <- api/workers"
type = "layers"
layers = [
  "app.api | app.workers",
  "app.services",
  "app.adapters | app.db",
  "app.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework imports"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "app.adapters", "app.services", "app.api", "app.db", "app.workers",
  "httpx", "sqlalchemy", "fastapi", "psycopg",
]
